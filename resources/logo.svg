<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp Solid Linear Gradients (No ambient glow / lens-flare artifacts) -->
    <linearGradient id="vFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="vFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Solid Matte Technical Card -->
  <rect width="1000" height="200" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>

  <!-- Left Accent Anchor Line -->
  <line x1="12" y1="36" x2="12" y2="164" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- ==================== ICON MARK (Architectural Precision "V") ==================== -->
  <g transform="translate(68, 40)">
    <!-- Monogram Container Background Card -->
    <rect x="0" y="0" width="120" height="120" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>

    <!-- Left Structural Wing -->
    <path d="M 28 28 L 52 28 L 68 84 L 54 94 C 50.5 96.5 45.5 94.5 44 90.5 Z"
          fill="url(#vFacetLeft)"/>

    <!-- Right Traverse Wing -->
    <path d="M 92 28 L 68 28 L 48 84 L 64 94 C 67.5 96.5 72.5 94.5 74 90.5 Z"
          fill="url(#vFacetRight)"/>

    <!-- Precision Apex Keystone -->
    <polygon points="60,68 68,84 60,100 52,84" fill="#38bdf8"/>
  </g>

  <!-- ==================== TYPOGRAPHY & IDENTITY ==================== -->
  <g transform="translate(224, 46)">
    <!-- Brand Title -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <tspan font-size="44" font-weight="800" letter-spacing="2" fill="#f0f6fc">VELOX</tspan>
      <tspan dx="8" font-size="44" font-weight="400" letter-spacing="3" fill="#38bdf8">UI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="11.5" font-weight="600" letter-spacing="2" fill="#8b949e">
      OBJECT PASCAL MVVM &amp; FLUENT UI MICRO-FRAMEWORK <tspan fill="#38bdf8">•</tspan> DELPHI &amp; FREE PASCAL
    </text>

    <!-- Technical Specification Badges -->
    <g transform="translate(2, 94)">
      <!-- Badge 1: 40 Units -->
      <rect x="0" y="0" width="126" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="63" y="15" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#c9d1d9" text-anchor="middle" letter-spacing="1">40 ZERO-DEP UNITS</text>

      <!-- Badge 2: Compilers -->
      <rect x="136" y="0" width="138" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="205" y="15" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">DELPHI &amp; LAZARUS</text>

      <!-- Badge 3: Win11 Fluent -->
      <rect x="284" y="0" width="118" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="343" y="15" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">WIN11 FLUENT</text>

      <!-- Badge 4: Hardware GDI+ -->
      <rect x="412" y="0" width="110" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="467" y="15" font-family="'Segoe UI', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1">GDI+ VECTOR</text>
    </g>
  </g>
</svg>
