<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="680" height="140">
  <defs>
    <linearGradient id="vCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="vIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Minimalist Geometric 'V' Mark -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="104" height="104" rx="22" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <!-- Left Cyan Wing -->
    <polygon points="24,26 44,26 58,78 46,82" fill="url(#vCyan)" />
    <!-- Right Indigo Wing -->
    <polygon points="80,26 60,26 46,82 58,82" fill="url(#vIndigo)" />
    <!-- Center Emerald Spark -->
    <polygon points="47,26 57,26 52,48" fill="#10B981" />
  </g>

  <!-- Clean Wordmark & Tagline -->
  <g transform="translate(152, 0)">
    <text x="0" y="74" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      Velox<tspan fill="#38BDF8">UI</tspan>
    </text>
    <text x="2" y="106" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Fluent Dark Mode &amp; MVVM Micro-Framework for Delphi &amp; Lazarus
    </text>
  </g>
</svg>
