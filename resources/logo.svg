<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="1.0" />
    </linearGradient>
    <linearGradient id="sparkFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="1192" height="312" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.45">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="860" y1="0" x2="860" y2="320" />
  </g>

  <!-- Left Emblem: Aerodynamic Velox 'V' Vector Blades -->
  <g transform="translate(68, 52)">
    <!-- Outer Frosted GDI+ Card Frame -->
    <rect x="0" y="0" width="176" height="216" rx="28" fill="#131C2E" stroke="#334155" stroke-width="1.5" />
    <rect x="12" y="12" width="152" height="192" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1" />

    <!-- Left Cyan Blade of 'V' -->
    <polygon points="34,46 68,46 96,154 78,176" fill="url(#cyanGrad)" filter="url(#glow)" />
    <!-- Right Indigo Blade of 'V' -->
    <polygon points="142,46 108,46 78,176 96,176" fill="url(#indigoGrad)" filter="url(#glow)" />
    <!-- Center Speed Chevron Accent -->
    <polygon points="74,46 102,46 88,104" fill="#10B981" opacity="0.9" />

    <!-- Bottom Mini Telemetry Progress Bar inside Emblem -->
    <rect x="28" y="186" width="120" height="6" rx="3" fill="#1E293B" />
    <rect x="28" y="186" width="88" height="6" rx="3" fill="url(#emeraldGrad)" />
  </g>

  <!-- Center Typography & Value Proposition -->
  <g transform="translate(284, 88)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="298" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="16" y="19" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.2">
      DELPHI VCL &amp; LAZARUS LCL MICRO-FRAMEWORK
    </text>

    <!-- Main Title -->
    <text x="0" y="88" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1">
      Velox<tspan fill="#38BDF8">UI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="126" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
      Zero-Dependency Fluent Dark Mode, DWM Mica, GDI+ Vector Cards,
    </text>
    <text x="2" y="152" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
      Flicker-Free Virtual Grids &amp; Lock-Free MVVM Polling for Object Pascal
    </text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 174)">
      <rect x="0" y="0" width="126" height="26" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="14" y="17" font-family="Consolas, monospace" font-size="12" fill="#10B981" font-weight="700">✓ 0 External DLLs</text>

      <rect x="138" y="0" width="144" height="26" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="152" y="17" font-family="Consolas, monospace" font-size="12" fill="#38BDF8" font-weight="700">⚡ -85% Boilerplate</text>

      <rect x="294" y="0" width="138" height="26" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="308" y="17" font-family="Consolas, monospace" font-size="12" fill="#818CF8" font-weight="700">★ High-DPI Ready</text>

      <rect x="444" y="0" width="124" height="26" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="458" y="17" font-family="Consolas, monospace" font-size="12" fill="#F59E0B" font-weight="700">◆ Win11 DWM/NT</text>
    </g>
  </g>

  <!-- Right Live Telemetry Card Preview Graphic -->
  <g transform="translate(888, 52)">
    <rect x="0" y="0" width="256" height="216" rx="14" fill="#161F30" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.8">
      VELOX GDI+ TELEMETRY CARD
    </text>
    <text x="20" y="72" font-family="'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#F8FAFC">
      0.12 ms
    </text>
    <text x="20" y="94" font-family="'Segoe UI', sans-serif" font-size="12" fill="#10B981" font-weight="600">
      ● LVS_EX_DOUBLEBUFFER Active
    </text>

    <!-- Simulated Sparkline Area + Line -->
    <polygon points="20,164 20,144 54,138 88,148 122,122 156,130 190,108 236,114 236,164" fill="url(#sparkFill)" />
    <polyline points="20,144 54,138 88,148 122,122 156,130 190,108 236,114" fill="none" stroke="#38BDF8" stroke-width="2.5" />
    <circle cx="236" cy="114" r="4" fill="#38BDF8" />

    <!-- Bottom Progress Track -->
    <rect x="20" y="184" width="216" height="8" rx="4" fill="#0F172A" />
    <rect x="20" y="184" width="182" height="8" rx="4" fill="url(#cyanGrad)" />
  </g>
</svg>
